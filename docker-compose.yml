services:
  db:
    image: postgres:16-alpine
    container_name: webservices-db
    environment:
      POSTGRES_DB: webservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: webservices-auth
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: webservice
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 12345678
      JWT_SECRET: change_this_secret
      PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      - db

  vehicle-service:
    build:
      context: ./backend/vehicle-service
    container_name: webservices-vehicle
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: webservice
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 12345678
      JWT_SECRET: change_this_secret
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      - db

  traffic-service:
    build:
      context: ./backend/traffic-service
    container_name: webservices-traffic
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: webservice
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 12345678
      JWT_SECRET: change_this_secret
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      - db

  incident-service:
    build:
      context: ./backend/incident-service
    container_name: webservices-incident
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: webservice
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 12345678
      JWT_SECRET: change_this_secret
      PORT: 4004
    ports:
      - "4004:4004"
    depends_on:
      - db

  gateway:
    build:
      context: ./backend/gateway
    container_name: webservices-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      VEHICLE_SERVICE_URL: http://vehicle-service:4002
      TRAFFIC_SERVICE_URL: http://traffic-service:4003
      INCIDENT_SERVICE_URL: http://incident-service:4004
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - vehicle-service
      - traffic-service
      - incident-service

  frontend:
    build:
      context: ./frontend
    container_name: webservices-frontend
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  db_data:

